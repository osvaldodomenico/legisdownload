version: "3.9"

services:
  api:
    build: ./backend
    restart: unless-stopped
    volumes:
      - /tmp/shiftdownloads:/tmp/shiftdownloads
    environment:
      - TMPDIR=/tmp/shiftdownloads

  web:
    build: ./frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - web
