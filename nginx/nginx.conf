server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        client_max_body_size 0;
    }

    location / {
        proxy_pass http://web:80/;
        proxy_set_header Host $host;
    }
}
