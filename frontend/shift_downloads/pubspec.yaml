name: shift_downloads
description: Media downloader — YouTube, Instagram, TikTok, Vimeo, Facebook
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
